databases:
  - name: mysite-db
    databaseName: surxon_db
    user: surxon_user
    plan: free

services:
  - type: web
    name: surxon-ilmtafakkur
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: mysite-db
          property: connectionString
